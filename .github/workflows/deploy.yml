name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# DISABLED on purpose: this workflow only copies index.html + 3 JSON files with
# keep_files:false, which wipes app.js / data/ / audio/ that are deployed manually
# via the Git Database API to gh-pages. Re-enable ONLY after rewriting the publish
# step to copy the full generated site (app.js, data/, audio/).
if: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare minimal site (audio served via jsDelivr CDN)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp site_data.json data_full.json audio_manifest.json _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          enable_jekyll: false
          keep_files: false
